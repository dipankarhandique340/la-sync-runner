name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login variants
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "== warm site =="
          curl -s -m 30 -c jar.txt -o /dev/null -w "site:%{http_code}\n" -A "$UA" https://letsapproach.akamai.net.in/
          echo "site cookies:"; cat jar.txt | grep -v '^#' | head -5
          echo "== api root with cookies =="
          curl -s -m 30 -b jar.txt -c jar.txt -o /dev/null -w "api_root:%{http_code}\n" -A "$UA" https://letsapproachapi.akamai.net.in/
          echo "api cookies:"; cat jar.txt | grep -v '^#' | head -10
          echo "== check_user_exist =="
          curl -s -m 30 -b jar.txt -w "\ncheck_user_exist:%{http_code}\n" -A "$UA" \
            -H "auth-key: appxapi" -H "client-service: Appx" -H "source: website" \
            -H "accept: application/json, text/plain, */*" -H "accept-language: en-US,en;q=0.9" \
            -H "origin: https://letsapproach.akamai.net.in" -H "referer: https://letsapproach.akamai.net.in/" \
            "https://letsapproachapi.akamai.net.in/get/check_user_exist?email_or_phone=probe-not-a-user%40example.com" | head -c 400
          echo
          echo "== login minimal =="
          curl -s -m 30 -o l1.txt -w "login_min:%{http_code} " -X POST "https://letsapproachapi.akamai.net.in/post/userLogin?extra_details=1" \
            -H "auth-key: appxapi" -H "client-service: Appx" -H "source: website" \
            --data "source=website&email=probe-not-a-user%40example.com&password=wrongpassword123&extra_details=1"; head -c 200 l1.txt; echo
          echo "== login browser-like + cookies =="
          curl -s -m 30 -b jar.txt -o l2.txt -w "login_full:%{http_code} " -X POST "https://letsapproachapi.akamai.net.in/post/userLogin?extra_details=1" \
            -A "$UA" \
            -H "auth-key: appxapi" -H "client-service: Appx" -H "source: website" -H "device-type: web" \
            -H "accept: application/json, text/plain, */*" -H "accept-language: en-US,en;q=0.9" \
            -H "origin: https://letsapproach.akamai.net.in" -H "referer: https://letsapproach.akamai.net.in/" \
            -H "sec-fetch-site: same-site" -H "sec-fetch-mode: cors" -H "sec-fetch-dest: empty" \
            --data "source=website&email=probe-not-a-user%40example.com&password=wrongpassword123&extra_details=1"; head -c 300 l2.txt; echo
          echo "== login with extra headers/params =="
          curl -s -m 30 -o l3.txt -w "login_v3:%{http_code} " -X POST "https://letsapproachapi.akamai.net.in/post/userLogin" \
            -A "$UA" \
            -H "auth-key: appxapi" -H "client-service: Appx" -H "source: website" \
            -H "accept: application/json, text/plain, */*" \
            -H "origin: https://letsapproach.akamai.net.in" -H "referer: https://letsapproach.akamai.net.in/" \
            --data "source=website&email=probe-not-a-user%40example.com&password=wrongpassword123"; head -c 300 l3.txt; echo
