name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests pycryptodome pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name LA-Sync-Downloader desktop/la_sync_downloader.py
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = Get-ChildItem -Path ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist\ffmpeg.exe
          Copy-Item desktop\README.txt dist\README.txt
          Compress-Archive -Path dist\LA-Sync-Downloader.exe, dist\ffmpeg.exe, dist\README.txt -DestinationPath LA-Sync-Downloader-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1
          name: LA Sync Downloader (Windows)
          body: "Windows downloader for Let's Approach courses."
          files: LA-Sync-Downloader-win64.zip
